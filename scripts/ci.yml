# Runs every test suite on each push and pull request.
# Backend tests run twice: fast (pg-mem) and against a real Postgres, which is
# the only way to prove the locking / rollback behaviour (organised.md T0).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gatekeep
          POSTGRES_PASSWORD: gatekeep
          POSTGRES_DB: gatekeep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gatekeep"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://gatekeep:gatekeep@localhost:5432/gatekeep_test

  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r requirements.txt
      # Build the sandbox image so the real Docker tests run instead of skipping.
      - run: docker build -t gatekeep-sandbox sandbox
      - run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
